<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victor Ferreira — Portefólio Escolar</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131c31;
      --card-border: #1e293b;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 1.5rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Cabeçalho */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 2rem 1rem;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.05) 0%, transparent 100%);
      border-bottom: 1px solid var(--card-border);
      border-radius: 16px;
    }

    header h1 {
      font-size: 2.2rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    /* Secções e Categorias */
    .subject-category {
      margin-bottom: 3rem;
    }

    .subject-title {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-transform: capitalize;
      font-weight: 700;
      border-left: 4px solid var(--accent);
      padding-left: 0.75rem;
    }

    /* Grelha de Publicações Otimizada para Telemóvel */
    .posts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 640px) {
      .posts-grid {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
    }

    /* Cartão de Publicação */
    .post-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .post-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.4);
    }

    .post-image-wrapper {
      width: 100%;
      height: 180px;
      overflow: hidden;
      background-color: #000;
    }

    .post-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .post-card:hover img {
      transform: scale(1.05);
    }

    .post-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .post-content h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.4;
    }

    .post-content p {
      font-size: 0.9rem;
      color: var(--text-muted);
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .post-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .post-link:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    /* Mensagem de Estado / Erro */
    .status-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 3rem 1rem;
    }

    /* Estilo injetado quando se visualiza o trabalho (Modo Leitor Estilizado) */
    body.viewing-mode {
      padding: 0;
      background-color: var(--bg-color);
    }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    <header>
      <h1>Victor Ferreira</h1>
      <p>Portefólio de Trabalhos Escolares</p>
    </header>

    <main id="app">
      <div id="status" class="status-msg">A carregar trabalhos com estilo...</div>
    </main>
  </div>

  <script>
    async function initPortfolio() {
      const app = document.getElementById('app');
      const status = document.getElementById('status');
      const container = document.getElementById('main-container');

      // Parâmetro para ver um trabalho específico de forma bonita (?trabalho=nome.html)
      const urlParams = new URLSearchParams(window.location.search);
      const targetWork = urlParams.get('trabalho');

      if (targetWork) {
        document.body.classList.add('viewing-mode');
        try {
          const res = await fetch(targetWork);
          if (!res.ok) throw new Error('Não foi possível carregar o trabalho.');
          const htmlText = await res.text();

          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          // Recolhe os elementos do trabalho
          const title = doc.querySelector('h1')?.innerHTML || 'Trabalho Escolar';
          const img = doc.querySelector('img')?.outerHTML || '';
          const bodyContent = doc.querySelector('body').innerHTML;

          container.innerHTML = `
            <div style="max-width: 750px; margin: 0 auto; padding: 2rem 1rem;">
              <a href="index.html" class="post-link" style="margin-bottom: 2rem; display: inline-flex;">&larr; Voltar ao Início</a>
              <article style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
                <div style="margin-bottom: 1.5rem;">
                  ${img ? `<div style="border-radius: 12px; overflow:hidden; margin-bottom: 1.5rem; max-height: 350px;">${img.replace(/style="[^"]*"/g, '').replace(/width="[^"]*"/g, '').replace(/height="[^"]*"/g, 'style="width:150%; height:auto; display:block;"')}</div>` : ''}
                  <h1 style="font-size: 1.8rem; color: var(--text-main); margin-bottom: 1rem; font-weight: 700;">${title}</h1>
                </div>
                <div style="color: var(--text-muted); font-size: 1rem; line-height: 1.8;" class="work-body-content">
                  ${bodyContent}
                </div>
              </article>
              <div style="text-align: center; margin-top: 2rem;">
                <a href="index.html" class="post-link">&larr; Voltar ao Início</a>
              </div>
            </div>
          `;
          
          // Ajusta imagens internas do corpo do documento para ficarem bonitas e responsivas
          container.querySelectorAll('.work-body-content img').forEach(image => {
            image.style.maxWidth = '100%';
            image.style.height = 'auto';
            image.style.borderRadius = '8px';
            image.style.margin = '1rem 0';
          });

          // Oculta h1 duplicado se já estiver no conteúdo principal
          const firstH1 = container.querySelector('.work-body-content h1');
          if (firstH1) firstH1.style.display = 'none';

          return;
        } catch (e) {
          container.innerHTML = `<div class="status-msg">Erro ao carregar o trabalho. <br><br><a href="index.html" class="post-link">Voltar ao Início</a></div>`;
          return;
        }
      }

      // Modo Principal (Grelha de Publicações via GitHub API)
      try {
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const owner = window.location.hostname.split('.')[0];
        const repo = pathParts[0] || '';

        if (!owner || !repo) {
          status.textContent = 'A aguardar publicação no GitHub Pages...';
          return;
        }

        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents`);
        if (!response.ok) throw new Error('Erro ao aceder ao repositório.');

        const files = await response.json();
        const htmlFiles = files.filter(f => f.name.endsWith('.html') && f.name !== 'index.html');

        if (htmlFiles.length === 0) {
          status.textContent = 'Ainda nenhum trabalho publicado em HTML.';
          return;
        }

        const categories = {};

        for (const file of htmlFiles) {
          const res = await fetch(file.download_url);
          const htmlText = await res.text();

          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          const titleText = doc.querySelector('title')?.textContent || '';
          
          if (titleText.includes('-')) {
            const [subject, workName] = titleText.split('-').map(str => str.trim());

            const h1 = doc.querySelector('h1')?.textContent || workName;
            const imgSrc = doc.querySelector('img')?.getAttribute('src') || '';
            const p = doc.querySelector('p')?.textContent || '';

            if (!categories[subject]) {
              categories[subject] = [];
            }

            categories[subject].push({
              title: h1,
              img: imgSrc,
              description: p,
              urlFile: file.name
            });
          }
        }

        status.style.display = 'none';

        if (Object.keys(categories).length === 0) {
          status.style.display = 'block';
          status.textContent = 'Nenhum trabalho encontrado com o formato correto no <title> (Disciplina - Nome).';
          return;
        }

        for (const [subject, posts] of Object.entries(categories)) {
          const section = document.createElement('section');
          section.className = 'subject-category';

          const subjectHeader = document.createElement('h2');
          subjectHeader.className = 'subject-title';
          subjectHeader.textContent = subject;
          section.appendChild(subjectHeader);

          const grid = document.createElement('div');
          grid.className = 'posts-grid';

          posts.forEach(post => {
            const card = document.createElement('article');
            card.className = 'post-card';

            const imgHtml = post.img ? `<div class="post-image-wrapper"><img src="${post.img}" alt="${post.title}" loading="lazy"></div>` : '';

            card.innerHTML = `
              ${imgHtml}
              <div class="post-content">
                <h2>${post.title}</h2>
                <p>${post.description || 'Sem descrição detalhada.'}</p>
                <a href="?trabalho=${post.urlFile}" class="post-link">Ler trabalho &rarr;</a>
              </div>
            `;
            grid.appendChild(card);
          });

          section.appendChild(grid);
          app.appendChild(section);
        }

      } catch (err) {
        status.textContent = 'Erro ao carregar os trabalhos do GitHub. Verifica a ligação.';
        console.error(err);
      }
    }

    initPortfolio();
  </script>
</body>
</html>
